name: Release Desktop Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Release & Draft
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Desktop Application
        run: npm run tauri:build

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe -Destination dist-release\
          Copy-Item src-tauri\target\release\bundle\msi\*.msi -Destination dist-release\
          
          Get-ChildItem -Path dist-release -File | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Append -Encoding ascii -FilePath dist-release\SHA256SUMS.txt
          }
          
          Get-Content dist-release\SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TomGee's Scholar Studio ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body_path: docs/RELEASE_NOTES_${{ github.ref_name }}.md
          generate_release_notes: true
          files: |
            dist-release/*.exe
            dist-release/*.msi
            dist-release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
